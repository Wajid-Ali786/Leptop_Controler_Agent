# AI Desktop Companion - non-secret settings (safe to commit).
# Secrets (ANTHROPIC_API_KEY) live in .env, never here.
# Read ONLY through config/settings.py -> get_setting(name) (docs/step3 Section 3).
#
# Values are added as each Phase 0 feature needs them (docs/step4 Section 3).

# --- Language preferences ---

# --- Confirmation rules (app/safety/logic.py) ---
# Minimal Phase 0 Permission & Safety gate. An action containing a risky keyword - as a
# whole word or common verb form (delete/deletes/deleted/deleting) - is Medium risk and
# needs confirmation ("close" too, because closing can lose unsaved work). Any other word that
# merely contains a keyword (e.g. "resend") is treated as risky too, unless listed in safe_words. Missing/invalid settings here make
# EVERY action require confirmation (fail closed).
# The Roman Urdu verbs (mita = erase, hata = remove, band = shut/close, bhej = send,
# khatam = finish/end, saaf = clean/wipe) and their common forms are a STOPGAP until Phase 3's
# reasoning-aware classification. Phrases come before their single word so the rule names
# the more specific match.
safety:
  risky_keywords: [
    delete, shutdown, "shut down", send,
    close,
    mita, mitao, mitana, mitado,
    hata, hatao, hatana, hatado,
    band,
    bhej, bhejo, bhejna, bheja, bhejdo,
    "khatam karo", "khatam kar do", "khatam kardo", khatam, khatm,
    "saaf karo", "saaf kar do", "saaf kardo", saaf,
  ]
  # Unrelated words that merely CONTAIN a keyword. safe_words can't exempt a keyword itself or
  # its verb forms (e.g. English "band", or "saaf"/"khatam" used as adjectives) - those stay
  # risky until Phase 3. Likewise "close" as an adjective ("close by", "closer") stays risky.
  safe_words: [
    sender, senders,
    closet, closets, disclose, discloses, disclosed, disclosure, enclose, encloses, enclosed, enclosure,
    husband, husbands, bandwidth, broadband, bandage, bandages, bandana, bandar,
    khata,
  ]

# --- Folder paths ---

# --- Logging (app/logging_setup.py) ---
logging:
  file: logs/companion.log   # rotated copies: companion.1.log, companion.2.log, ... (git-ignored by logs/*.log)
  level: INFO                # DEBUG, INFO, WARNING, ERROR or CRITICAL
  max_bytes: 1000000         # rotate when the file reaches ~1 MB
  backup_count: 5            # rotated files to keep

# --- Executor (app/executor/) ---
executor:
  # Apps the assistant may open: name -> Windows executable. Anything not listed is refused,
  # never guessed (Phase 4 memory adds user aliases). Every open still passes the safety gate.
  apps:
    notepad: notepad.exe
    calculator: calc.exe
  # Action -> Result -> Recovery: attempts per action, including the first. A failed, retryable
  # attempt is offered to the user for retry - never silently continued.
  max_attempts: 3
  # Type text: the most characters one action may type, and the pause between characters (the
  # emergency stop and a change of active window are checked before every character).
  max_type_characters: 1000
  typing_interval_seconds: 0.01

# --- Verifier (app/verifier/) ---
verifier:
  window_timeout_seconds: 15    # how long a newly opened app gets to show its window, or a closed one to go
  poll_interval_seconds: 0.25   # how often to look (the emergency stop interrupts the wait)
  text_settle_seconds: 1.0      # after typing, how long to look for the text in the field
  max_read_characters: 100000   # a field with more text than this isn't read back (typing stays unverified)
  # Title of each app's window (case-insensitive regular expression). Opening an app only counts
  # as done when a NEW window matching it appears; windows already open never count. Closing an app
  # only closes windows the assistant opened in this session, and counts as done when they're gone.
  app_windows:
    notepad: "Notepad$"
    calculator: "^Calculator$"

# --- Brain (Claude API) ---
brain:
  # MODEL SELECTION PENDING: claude-opus-5 is a placeholder until cost/performance
  # is evaluated. Whatever model is set here must also have a price below.
  model: claude-opus-5
  timeout_seconds: 30        # per-request timeout, so a network problem fails fast
  max_retries: 2             # SDK retries for connection errors, 429 and 5xx
  ping_max_tokens: 256       # output cap for the minimal health/test request

# --- Cost controls (docs/build-plan Section 5.5) ---
# Enforced by app/brain/cost_controls.py before every Claude request.
# LIMITS STATUS: VERIFIED - confirmed by the project owner on 2026-09-16
# (30 requests/min, 20000 input and 4096 output tokens per request, $1/day, $10/month).
cost:
  rate_limit_per_minute: 30             # Rate limit: max Claude requests in any rolling 60 seconds
  max_input_tokens_per_request: 20000   # Token limit: estimated input tokens per request
  max_output_tokens_per_request: 4096   # Token limit: max_tokens a single request may ask for
  daily_budget_usd: 1.00                # Money budget: hard stop per calendar day (local time)
  monthly_budget_usd: 10.00             # Money budget: hard stop per calendar month
  usage_db_path: data/claude_usage.db   # usage ledger - git-ignored by data/*.db
  # USD per million tokens. PRICES STATUS: VERIFIED against https://claude.com/pricing on 2026-09-16
  # (Opus 5 $5/$25, Sonnet 5 $2/$10, Haiku 4.5 $1/$5 per million tokens). Re-check when models change.
  # A model with no entry here is blocked, because its cost can't be budgeted.
  prices_usd_per_million_tokens:
    claude-opus-5:    {input: 5.00, output: 25.00}
    claude-sonnet-5:  {input: 2.00, output: 10.00}
    claude-haiku-4-5: {input: 1.00, output: 5.00}
